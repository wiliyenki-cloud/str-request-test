<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IP Release</title>
  <link rel="stylesheet" href="../ico-detail/index.css">
  <style>
    .zero { color: #c62828; }
    .note { font-size: 12px; color: #888; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="page">
    <div class="top-bar">
      <button id="btn-back" class="btn-back">&#8592; Kembali</button>
    </div>
    <div id="screen-loading" class="center-msg"><p>Memuat detail...</p></div>
    <div id="screen-error" class="center-msg" style="display:none">
      <p id="err-text" class="err-text"></p>
    </div>
    <div id="screen-content" style="display:none">
      <div class="section" id="section-header"></div>
      <div class="section">
        <div class="section-title" id="items-title">Item List</div>
        <div class="table-wrap" id="items-table"></div>
        <div class="note">Item dengan Qty final 0 tidak ikut di CSV.</div>
      </div>
      <div class="section" id="section-pr" style="display:none">
        <div class="section-title">Nomor PR dari SAP *</div>
        <input type="text" id="pr-number-input" class="text-input" placeholder="Masukkan nomor PR...">
      </div>
      <div class="section" id="section-reject" style="display:none">
        <div class="section-title">Alasan Tolak *</div>
        <textarea id="reject-reason" class="reject-input" placeholder="Tuliskan alasan..."></textarea>
      </div>
    </div>
    <div id="toast" class="toast" style="display:none"></div>
    <!-- Status Waiting IP Release -->
    <div class="footer" id="footer-wait" style="display:none">
      <button class="btn-reject" id="btn-start-reject">Tolak</button>
      <button class="btn-done" id="btn-make-csv">Buat CSV</button>
    </div>
    <!-- Status CSV Ready -->
    <div class="footer" id="footer-ready" style="display:none">
      <button class="btn-csv" id="btn-csv-again">Unduh CSV</button>
      <button class="btn-confirm-done" id="btn-save-pr" disabled>Simpan ke Lark</button>
    </div>
    <!-- Konfirmasi tolak -->
    <div class="footer" id="footer-reject" style="display:none">
      <button class="btn-cancel" id="btn-cancel-reject">Batal</button>
      <button class="btn-confirm-reject" id="btn-confirm-reject" disabled>Konfirmasi Tolak</button>
    </div>
  </div>
  <script src="https://lf1-cdn-tos.bytegoofy.com/goofy/lark/op/h5-js-sdk-1.5.20.js"></script>
  <script src="../../utils/config.js?v=17"></script>
  <script src="../../utils/auth.js?v=21"></script>
  <script src="../../utils/api.js?v=13"></script>
  <script src="../../utils/debug.js?v=3"></script>
  <script src="../../utils/flow.js?v=6"></script>
  <script src="index.js?v=2"></script>
</body>
</html>
