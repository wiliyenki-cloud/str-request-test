<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IP Release</title>
  <link rel="stylesheet" href="../ico-list/index.css">
  <style>
    .filter-bar { display: flex; flex-direction: column; gap: 8px; margin: 0 0 10px; }
    .filter-bar input, .filter-bar select { width: 100%; border: 1px solid #d0d0d0; border-radius: 6px; padding: 9px 10px; font-size: 14px; box-sizing: border-box; background: #fff; }
    .filter-row { display: flex; gap: 8px; }
    .filter-row select { flex: 1; min-width: 0; }
    .result-count { font-size: 12px; color: #888; margin: 0 0 6px; }
    .btn-more { display: block; margin: 4px auto 0; background: #fff; border: 1px solid #d0d0d0; border-radius: 6px; padding: 8px 18px; font-size: 13px; cursor: pointer; }
    .bulk-bar { position: sticky; top: 0; z-index: 5; background: #f5f6f8; padding: 8px 0; margin: 0 0 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border-bottom: 1px solid #e3e3e3; }
    .bulk-bar .sel-count { font-size: 13px; font-weight: 600; margin-right: auto; }
    .bulk-bar button { border: 1px solid #d0d0d0; background: #fff; border-radius: 6px; padding: 7px 10px; font-size: 13px; cursor: pointer; }
    .bulk-bar button.primary { background: #1976d2; border-color: #1976d2; color: #fff; }
    .bulk-bar button:disabled { opacity: .5; cursor: default; }
    .bulk-status { font-size: 12.5px; white-space: pre-line; margin: 0 0 8px; color: #333; }
    .bulk-status.err { color: #c62828; }
    .bulk-status.warn { color: #ef6c00; }
    .bulk-status.ok { color: #2e7d32; }
    .cb-wrap { display: inline-flex; align-items: center; padding: 4px 8px 4px 0; cursor: pointer; }
    .cb-wrap input { width: 18px; height: 18px; margin: 0; cursor: pointer; }
    .card-left { display: flex; align-items: center; min-width: 0; }
  </style>
</head>
<body>
  <div class="page">
    <div class="top-bar">
      <button id="btn-back" class="btn-back">&#8592; Home</button>
    </div>
    <div class="filter-tabs" id="filter-tabs">
      <div class="filter-tab active">Antrian IP</div>
    </div>
    <div class="filter-bar">
      <input type="text" id="search-input" placeholder="&#128269; Nomor STR / site...">
      <div class="filter-row">
        <select id="status-select" title="Status">
          <option value="">Semua status</option>
          <option value="waiting-ip">Siap dibuat CSV</option>
          <option value="csv-ready">Menunggu PR</option>
        </select>
        <select id="site-select" title="Site"><option value="">Semua site</option></select>
      </div>
    </div>
    <div id="bulk-status" class="bulk-status" style="display:none"></div>
    <div id="screen-loading" class="center-msg"><p>Memuat data...</p></div>
    <div id="screen-error" class="center-msg" style="display:none">
      <p id="err-text" class="err-text"></p>
      <button id="btn-retry" class="btn-retry">Coba Lagi</button>
    </div>
    <div id="screen-empty" class="center-msg" style="display:none">
      <p id="empty-text">Tidak ada STR yang perlu diproses.</p>
    </div>
    <div id="screen-list" style="display:none">
      <div class="bulk-bar" id="bulk-bar">
        <span id="sel-count" class="sel-count">0 dipilih</span>
        <button type="button" id="btn-sel-ready">Pilih semua yang siap</button>
        <button type="button" id="btn-sel-clear">Kosongkan</button>
        <button type="button" id="btn-bulk-sel" class="primary" disabled>Buat CSV (0)</button>
        <button type="button" id="btn-bulk-all" class="primary" disabled>Buat semua yang belum dibuat (0)</button>
      </div>
      <div id="list-container" class="list"></div>
    </div>
  </div>
  <script src="https://lf1-cdn-tos.bytegoofy.com/goofy/lark/op/h5-js-sdk-1.5.20.js"></script>
  <script src="../../utils/config.js?v=25"></script>
  <script src="../../utils/auth.js?v=21"></script>
  <script src="../../utils/api.js?v=13"></script>
  <script src="../../utils/debug.js?v=4"></script>
  <script src="../../utils/flow.js?v=25"></script>
  <script src="../../utils/ipbulk.js?v=1"></script>
  <script src="index.js?v=4"></script>
</body>
</html>
