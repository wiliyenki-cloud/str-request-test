<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MD Review</title>
  <link rel="stylesheet" href="../ico-detail/index.css">
  <style>
    select.md-dec, input.md-qty { font-size: 12px; padding: 4px; border: 1px solid #d0d0d0; border-radius: 4px; }
    input.md-qty { width: 56px; text-align: right; }
    .koli-tag { display: inline-block; margin-top: 2px; padding: 0 6px; font-size: 10px; color: #8a5a00; background: #fff3d6; border-radius: 8px; }
    .bulk { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 10px; }
    .bulk button { flex: 1; min-width: 96px; background: #fff; border: 1px solid #d0d0d0; border-radius: 6px; padding: 8px 10px; font-size: 13px; cursor: pointer; }
    .bulk button:disabled { opacity: .5; cursor: default; }
    .note { font-size: 12px; color: #888; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="page">
    <div class="top-bar">
      <button id="btn-back" class="btn-back">&#8592; Kembali</button>
    </div>
    <div id="screen-loading" class="center-msg"><p>Memuat detail...</p></div>
    <div id="screen-error" class="center-msg" style="display:none">
      <p id="err-text" class="err-text"></p>
    </div>
    <div id="screen-content" style="display:none">
      <div class="section" id="section-header"></div>
      <div class="section">
        <div class="section-title" id="items-title">Item List</div>
        <div class="bulk" id="bulk-actions">
          <button type="button" data-bulk="ok">Setuju semua</button>
          <button type="button" data-bulk="qty">Ubah semua</button>
          <button type="button" data-bulk="reject">Tolak semua</button>
        </div>
        <div class="table-wrap" id="items-table"></div>
        <div class="note">Kolom stok, penjualan, dan saran berasal dari hasil RPA STR.</div>
      </div>
      <div class="section" id="section-reject" style="display:none">
        <div class="section-title">Alasan Tolak STR *</div>
        <textarea id="reject-reason" class="reject-input" placeholder="Tuliskan alasan..."></textarea>
      </div>
    </div>
    <div id="toast" class="toast" style="display:none"></div>
    <div class="footer" id="footer-main" style="display:none">
      <button class="btn-reject" id="btn-start-reject">Tolak STR</button>
      <button class="btn-done" id="btn-send">Kirim ke IP</button>
    </div>
    <div class="footer" id="footer-reject" style="display:none">
      <button class="btn-cancel" id="btn-cancel-reject">Batal</button>
      <button class="btn-confirm-reject" id="btn-confirm-reject" disabled>Konfirmasi Tolak</button>
    </div>
  </div>
  <script src="https://lf1-cdn-tos.bytegoofy.com/goofy/lark/op/h5-js-sdk-1.5.20.js"></script>
  <script src="../../utils/config.js?v=16"></script>
  <script src="../../utils/auth.js?v=21"></script>
  <script src="../../utils/api.js?v=13"></script>
  <script src="../../utils/debug.js?v=3"></script>
  <script src="../../utils/flow.js?v=5"></script>
  <script src="index.js?v=3"></script>
</body>
</html>
